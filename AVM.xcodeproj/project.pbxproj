		06D1147C2FE0D50300AC265D /* ShellScript */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = "#!/bin/sh";
			shellScript = "FRAMEWORKS_SRC=\"${AVM_SYSROOT}/Frameworks\"\nFRAMEWORKS_DST=\"${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\nRESOURCES_DST=\"${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources\"\nDYLIBS_SRC=\"${AVM_SYSROOT}/lib\"\nQEMU_BIN_SRC=\"${AVM_SYSROOT}/bin\"\nSYSROOT_PREFIX=\"${AVM_SYSROOT}/lib\"\nSYSROOT_SHARE_QEMU=\"${AVM_SYSROOT}/share/qemu\"\nRUNNER_PREFIX=\"/Users/runner\"\nENTITLEMENTS=\"${SRCROOT}/AVM/AVM.entitlements\"\n\nmkdir -p \"$FRAMEWORKS_DST\"\n\necho \"Copying non-QEMU frameworks (QEMU's own classes live in the dlibs we copy to Resources; copying its frameworks too would duplicate Objective-C classes)...\"\nfor fw in \"$FRAMEWORKS_SRC\"/*.framework; do\n    fw_name=$(basename \"$fw\")\n    case \"$fw_name\" in\n        qemu-*-softmmu.framework|qemu-img.framework)\n            continue\n            ;;\n    esac\n    dst=\"$FRAMEWORKS_DST/$fw_name\"\n    if [ -d \"$fw\" ]; then\n        rm -rf \"$dst\"\n        cp -R \"$fw\" \"$dst\"\n        codesign --force --sign - \"$dst\"\n        echo \"Copied and signed $fw_name\"\n    fi\ndone\n\necho \"Copying dylibs to Resources...\"\ncp \"$DYLIBS_SRC\"/lib*.dylib \"$RESOURCES_DST/\"\necho \"Dylibs copied.\"\n\necho \"Copying QEMU executable (qemu-system-aarch64) and qemu-img to Resources...\"\ncp \"$QEMU_BIN_SRC/qemu-system-aarch64\" \"$RESOURCES_DST/\"\nif [ -f \"$QEMU_BIN_SRC/qemu-img\" ]; then\n    cp \"$QEMU_BIN_SRC/qemu-img\" \"$RESOURCES_DST/\"\nfi\necho \"QEMU executables copied.\"\n\necho \"Copying swtpm executable to Resources...\"\nif [ -f \"$QEMU_BIN_SRC/swtpm\" ]; then\n    cp \"$QEMU_BIN_SRC/swtpm\" \"$RESOURCES_DST/\"\n    echo \"swtpm copied.\"\nelse\n    echo \"WARNING: swtpm not found in $QEMU_BIN_SRC -- TPM 2.0 will be unavailable.\"\nfi\n\necho \"Copying install-pipeline tools (xorriso, wimlib-imagex, mtools) to Resources. These are invoked as separate child processes (exec-over-CLI) at VM-create time to build the modified bootable ISO + answer image -- xorriso (ISO extract/rebuild + el-torito), wimlib-imagex (winpeshl.ini injection into boot.wim), mtools (FAT answer image). The mtools 'mformat'/'mcopy'/'mdir' symlinks are recreated in a dedicated step below (mtools dispatches by argv[0], so they MUST be symlinks to the one real 'mtools' binary, not duplicate copies)...\"\nfor tool in \"xorriso\" \"wimlib-imagex\" \"mtools\"; do\n    if [ -f \"$QEMU_BIN_SRC/$tool\" ]; then\n        cp \"$QEMU_BIN_SRC/$tool\" \"$RESOURCES_DST/\"\n        echo \"Copied $tool.\"\n    else\n        echo \"WARNING: $tool not found in $QEMU_BIN_SRC -- the install pipeline will be unavailable.\"\n    fi\ndone\necho \"Install-pipeline tools copied. (wimlib's libwim.15.dylib is in the sysroot lib/ dir and is handled by the generic dylib copy + rewrite + sign loops above/below -- no special-casing.)\"\n\necho \"Staging firmware + ROM files from the sysroot into Resources (so a CLEAN build can never wipe them -- previously these were manual copies lost on Shift-Cmd-K). Sources:\"\necho \"  - edk2-aarch64-code.fd   : aarch64 UEFI firmware (readonly pflash 0)\"\necho \"  - edk2-arm-vars.fd       : UEFI variable-store TEMPLATE (padded to 64MB at runtime by VMManager to form the writable pflash 1)\"\necho \"  - vgabios-ramfb.bin      : ramfb VGA BIOS blob (silences the 'vgabios-ramfb.bin not found' warning; ramfb renders without it but a present ROM is cleaner)\"\nfor fwname in \"edk2-aarch64-code.fd\" \"edk2-arm-vars.fd\" \"vgabios-ramfb.bin\"; do\n    src=\"\"\n    # Prefer share/qemu (standard QEMU firmware location); fall back to a sysroot-wide search.\n    if [ -f \"$SYSROOT_SHARE_QEMU/$fwname\" ]; then\n        src=\"$SYSROOT_SHARE_QEMU/$fwname\"\n    else\n        src=$(find \"${AVM_SYSROOT}\" -name \"$fwname\" -type f 2>/dev/null | head -1)\n    fi\n    if [ -n \"$src\" ] && [ -f \"$src\" ]; then\n        cp \"$src\" \"$RESOURCES_DST/$fwname\"\n        echo \"Staged $fwname from $src\"\n    else\n        echo \"WARNING: $fwname not found in sysroot -- it will be missing from Resources.\"\n    fi\ndone\necho \"Firmware staging done.\"\n\necho \"Staging virtio ARM64 driver tree into Resources/virtio (NetKVM + Balloon for the install pipeline's Stage 3 \\$WinPEDriver\\$ drop, plus vioserial for Stage 4's answer-image guest-agent payload -- vioserial deliberately does NOT go into \\$WinPEDriver\\$; the answer image is its only ride). These are INERT DATA files (.inf/.sys/.cat/.exe) that Windows Setup reads INSIDE the guest -- they must NOT be signed or path-rewritten (re-signing the Red Hat .cat catalog would break Win11 ARM driver-signature validation). Source is project-relative (\\${SRCROOT}/Resources/virtio), so it travels with the project. rm -rf first so rebuilds are clean; cp -R preserves the NetKVM/, Balloon/, and vioserial/ subfolder structure...\"\nVIRTIO_SRC=\"${SRCROOT}/Resources/virtio\"\nif [ -d \"$VIRTIO_SRC\" ]; then\n    rm -rf \"$RESOURCES_DST/virtio\"\n    cp -R \"$VIRTIO_SRC\" \"$RESOURCES_DST/virtio\"\n    echo \"Staged virtio driver tree from $VIRTIO_SRC\"\n    echo \"  NetKVM files: $(ls -1 \"$RESOURCES_DST/virtio/NetKVM\" 2>/dev/null | wc -l | tr -d ' ') (expect 4)\"\n    echo \"  Balloon files: $(ls -1 \"$RESOURCES_DST/virtio/Balloon\" 2>/dev/null | wc -l | tr -d ' ') (expect 3)\"\n    echo \"  vioserial files: $(ls -1 \"$RESOURCES_DST/virtio/vioserial\" 2>/dev/null | wc -l | tr -d ' ') (expect 3 -- vioser.inf/.cat/.sys only; vioser.pdb is deliberately not in the project tree)\"\nelse\n    echo \"WARNING: $VIRTIO_SRC not found -- virtio drivers will be missing; OOBE will prompt for a network driver.\"\nfi\n\necho \"Staging SPICE vdagent MSI into Resources/vdagent (for the install pipeline's Stage 4 answer-image payload; the specialize pass installs it silently before OOBE for absolute-mouse parity). This is the STANDALONE spice-vdagent-x64-0.10.0.msi -- the virtio-win-guest-tools bundle rolls back on ARM64 and must not be swapped in. INERT DATA, copied verbatim, never signed. Source is project-relative so it travels with the project...\"\nVDAGENT_SRC=\"${SRCROOT}/Resources/vdagent\"\nif [ -d \"$VDAGENT_SRC\" ]; then\n    rm -rf \"$RESOURCES_DST/vdagent\"\n    cp -R \"$VDAGENT_SRC\" \"$RESOURCES_DST/vdagent\"\n    echo \"Staged vdagent from $VDAGENT_SRC\"\n    echo \"  vdagent files: $(ls -1 \"$RESOURCES_DST/vdagent\" 2>/dev/null | wc -l | tr -d ' ') (expect 1 -- spice-vdagent-x64-0.10.0.msi)\"\nelse\n    echo \"WARNING: $VDAGENT_SRC not found -- the vdagent MSI will be missing; the install pipeline's Stage 4 will fail with a named build-problem error rather than shipping media without mouse parity.\"\nfi\n\necho \"Removing non-aarch64 QEMU dylibs (only libqemu-aarch64-softmmu.dylib and libqemu-img.dylib are needed)...\"\nfor f in \"$RESOURCES_DST\"/libqemu-*.dylib; do\n    fname=$(basename \"$f\")\n    if [ \"$fname\" != \"libqemu-aarch64-softmmu.dylib\" ] && [ \"$fname\" != \"libqemu-img.dylib\" ]; then\n        rm -f \"$f\"\n    fi\ndone\necho \"Unused QEMU dylibs removed.\"\n\necho \"Rewriting hardcoded sysroot paths, CI runner paths, and bare @rpath references to @loader_path (dylibs)...\"\nfor dylib in \"$RESOURCES_DST\"/*.dylib; do\n    dylib_name=$(basename \"$dylib\")\n    own_id=$(otool -D \"$dylib\" | tail -n1)\n    if [[ \"$own_id\" == \"$SYSROOT_PREFIX\"* ]] || [[ \"$own_id\" == \"$RUNNER_PREFIX\"* ]]; then\n        install_name_tool -id \"@loader_path/$dylib_name\" \"$dylib\"\n    fi\n    for dep in $(otool -L \"$dylib\" | tail -n +2 | awk '{print $1}'); do\n        dep_name=$(basename \"$dep\")\n        if [[ \"$dep\" == \"$SYSROOT_PREFIX\"* ]] || [[ \"$dep\" == \"$RUNNER_PREFIX\"* ]]; then\n            install_name_tool -change \"$dep\" \"@loader_path/$dep_name\" \"$dylib\"\n        elif [[ \"$dep\" == @rpath/* ]]; then\n            if [ -f \"$RESOURCES_DST/$dep_name\" ]; then\n                install_name_tool -change \"$dep\" \"@loader_path/$dep_name\" \"$dylib\"\n            fi\n        fi\n    done\ndone\necho \"Dylib rpath rewriting done.\"\n\necho \"Rewriting executable dependency paths to @loader_path (QEMU + swtpm + install-pipeline tools). Note: mtools and xorriso are system-only (libSystem + libiconv) so the rewrite loop is a no-op for them; wimlib-imagex has its libwim.15.dylib ref already pointed at the sysroot prefix at stage time, so it IS rewritten to @loader_path here...\"\nfor exe in \"qemu-system-aarch64\" \"qemu-img\" \"swtpm\" \"xorriso\" \"wimlib-imagex\" \"mtools\"; do\n    exe_path=\"$RESOURCES_DST/$exe\"\n    [ -f \"$exe_path\" ] || continue\n    for dep in $(otool -L \"$exe_path\" | tail -n +2 | awk '{print $1}'); do\n        dep_name=$(basename \"$dep\")\n        if [[ \"$dep\" == \"$SYSROOT_PREFIX\"* ]] || [[ \"$dep\" == \"$RUNNER_PREFIX\"* ]]; then\n            install_name_tool -change \"$dep\" \"@loader_path/$dep_name\" \"$exe_path\"\n        elif [[ \"$dep\" == @rpath/* ]]; then\n            if [ -f \"$RESOURCES_DST/$dep_name\" ]; then\n                install_name_tool -change \"$dep\" \"@loader_path/$dep_name\" \"$exe_path\"\n            fi\n        fi\n    done\n    # Ensure the executable can resolve @rpath-style siblings in its own directory.\n    install_name_tool -add_rpath \"@loader_path\" \"$exe_path\" 2>/dev/null || true\n    chmod +x \"$exe_path\"\n    echo \"Fixed $exe\"\ndone\necho \"Executable path rewriting done.\"\n\necho \"Restoring versioned dylib symlinks (the sysroot ships e.g. libgio-2.0.dylib as a symlink to libgio-2.0.0.dylib, but 'cp' flattened them into duplicate real copies, causing duplicate Objective-C class warnings and double-loaded code). Recreate them AS symlinks, matching the sysroot, so each library is a single loaded image...\"\nfor src in \"$DYLIBS_SRC\"/*.dylib; do\n    name=$(basename \"$src\")\n    # Only act on entries that are symlinks in the sysroot.\n    if [ -L \"$src\" ]; then\n        target=$(readlink \"$src\")\n        bundled=\"$RESOURCES_DST/$name\"\n        # Only restore if the symlink target actually exists in the bundle, so we\n        # never create a dangling link (e.g. if the target was a removed QEMU dylib).\n        if [ -e \"$RESOURCES_DST/$target\" ]; then\n            rm -f \"$bundled\"\n            ln -s \"$target\" \"$bundled\"\n            echo \"Symlinked $name -> $target\"\n        fi\n    fi\ndone\necho \"Symlink restoration done.\"\n\necho \"Restoring mtools dispatch symlinks (mformat, mcopy, mdir). mtools dispatches by argv[0] -- the name it is invoked as -- so the pipeline must call it via symlinks named 'mformat'/'mcopy'/'mdir', each pointing at the one real 'mtools' binary. mformat and mcopy build the FAT answer image; mdir is the Stage 4 postcondition check (verifies autounattend.xml landed at the image root). The sysroot may not ship an 'mdir' symlink -- the loop defaults the target to 'mtools' in that case, which is correct...\"\nfor link in \"mformat\" \"mcopy\" \"mdir\"; do\n    if [ -L \"$DYLIBS_SRC/../bin/$link\" ] || [ -L \"$QEMU_BIN_SRC/$link\" ]; then\n        target=$(readlink \"$QEMU_BIN_SRC/$link\")\n    else\n        target=\"mtools\"\n    fi\n    # Default the target to 'mtools' if the sysroot readlink came back empty.\n    [ -n \"$target\" ] || target=\"mtools\"\n    if [ -f \"$RESOURCES_DST/mtools\" ]; then\n        rm -f \"$RESOURCES_DST/$link\"\n        ln -s \"$target\" \"$RESOURCES_DST/$link\"\n        echo \"Symlinked $link -> $target\"\n    else\n        echo \"WARNING: Resources/mtools missing -- cannot create $link symlink.\"\n    fi\ndone\necho \"mtools symlink restoration done.\"\n\necho \"Re-signing all real (non-symlink) dylibs in Resources with a plain ad-hoc signature. The install_name_tool path-rewriting above STRIPS each dylib's code signature, leaving it in a 'linker-signed / no CMS blob' state that AMFI rejects (it only loads today because disable-library-validation tolerates it). This step restores a clean ad-hoc signature on every bundled library — including the GStreamer dylibs that libspice-server loads via @loader_path. We skip symlinks (so we don't sign a library twice through its alias) and skip the QEMU dylibs, which get an ENTITLED signature in the dedicated step below...\"\nfor dylib in \"$RESOURCES_DST\"/*.dylib; do\n    # Skip symlinks — signing through an alias would double-sign the real file.\n    [ -L \"$dylib\" ] && continue\n    dylib_name=$(basename \"$dylib\")\n    # Skip the QEMU dylibs; they are entitlement-signed in the QEMU step below and\n    # must not get a plain signature here that the entitled sign would just redo.\n    case \"$dylib_name\" in\n        libqemu-aarch64-softmmu.dylib|libqemu-img.dylib)\n            continue\n            ;;\n    esac\n    codesign --force --sign - \"$dylib\"\ndone\necho \"Resources dylib re-signing done.\"\n\necho \"Signing swtpm (plain signature, NO hypervisor entitlement -- swtpm does not touch HVF)...\"\nif [ -f \"$RESOURCES_DST/swtpm\" ]; then\n    codesign --force --sign - \"$RESOURCES_DST/swtpm\"\nfi\nif [ -f \"$RESOURCES_DST/libswtpm_libtpms.0.dylib\" ]; then\n    codesign --force --sign - \"$RESOURCES_DST/libswtpm_libtpms.0.dylib\"\nfi\necho \"swtpm signed.\"\n\necho \"Signing install-pipeline tools (xorriso, wimlib-imagex, mtools) with a plain ad-hoc signature, NO entitlements -- none of them touch HVF. The path-rewriting above stripped any signature; restore a clean one. Skip the mtools 'mformat'/'mcopy'/'mdir' symlinks (signing through an alias would double-sign the one real 'mtools' binary)...\"\nfor tool in \"xorriso\" \"wimlib-imagex\" \"mtools\"; do\n    if [ -f \"$RESOURCES_DST/$tool\" ] && [ ! -L \"$RESOURCES_DST/$tool\" ]; then\n        codesign --force --sign - \"$RESOURCES_DST/$tool\"\n        echo \"Signed $tool.\"\n    fi\ndone\necho \"Install-pipeline tools signed.\"\n\necho \"Signing QEMU binaries with hypervisor entitlement (must be on the binary that calls hvf)...\"\ncodesign --force --sign - --entitlements \"$ENTITLEMENTS\" \"$RESOURCES_DST/qemu-system-aarch64\"\nif [ -f \"$RESOURCES_DST/qemu-img\" ]; then\n    codesign --force --sign - --entitlements \"$ENTITLEMENTS\" \"$RESOURCES_DST/qemu-img\"\nfi\nif [ -f \"$RESOURCES_DST/libqemu-aarch64-softmmu.dylib\" ]; then\n    codesign --force --sign - --entitlements \"$ENTITLEMENTS\" \"$RESOURCES_DST/libqemu-aarch64-softmmu.dylib\"\nfi\necho \"Fixing firmware permissions...\"\nchmod +x \"$RESOURCES_DST/edk2-aarch64-code.fd\" 2>/dev/null || true\nchmod +x \"$RESOURCES_DST/edk2-arm-vars.fd\" 2>/dev/null || true\necho \"Done.\"\n";
		};
