# ci.yml
# AVM — Accessible Virtual Machine
#
# Runs on every push and pull request (2026-10-26):
#   - the logic tests (Package.swift: password hashing, the log
#     sanitizer, saved configurations, Ubuntu account checks, the root USB
#     helper's socket check);
#   - a syntax and lint pass over the build scripts;
#   - well-formedness of the update feed and Info.plist.
# The app itself needs the UTM sysroot (Tools/build-sysroot.sh, about an
# hour), so it is built on a Mac, not here.
#
# RUNNERS (2026-10-26): macos-26 runners were short enough that GitHub
# gave up on every job after 15 minutes in the queue ("not acquired by
# Runner"), so each push was marked failed without running anything. The
# logic tests use macos-15, which has many more runners, with its newest
# Xcode (the package needs Swift 6.2). The script and file checks need no
# Mac at all and run on Linux.

name: CI

on:
  push:
  pull_request:

jobs:
  logic-tests:
    name: Logic tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $newest"
          sudo xcode-select -s "$newest"
      - name: Swift version
        run: swift --version
      - name: Run the logic tests
        run: swift test

  scripts-and-files:
    name: Scripts and files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: |
          # Every file's error fails the step (2026-10-29, sixth audit):
          # only the last file's status counted.
          for f in Tools/*.sh; do
            bash -n "$f" || exit 1
            echo "ok: $f"
          done
      - name: ShellCheck (errors only)
        run: shellcheck -S error Tools/*.sh
      - name: Update feed, answer file and Info.plist are well formed
        run: |
          sudo apt-get install -y libxml2-utils >/dev/null
          xmllint --noout appcast.xml Resources/autounattend.xml
          python3 -c "import plistlib; plistlib.load(open('AVM/Info.plist', 'rb')); print('ok: AVM/Info.plist')"
      - name: Sysroot patches are named for a UTM patch
        run: |
          for p in Tools/sysroot-patches/*.patch; do
            case "$(basename "$p")" in
              *+*.patch) echo "ok: $p" ;;
              *) echo "::error file=$p::name must be <UTM patch name>+<what it does>.patch"; exit 1 ;;
            esac
          done
